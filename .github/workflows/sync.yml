name: sync-db

on:
  schedule:
    # 每天 03:00 UTC = 北京时间 11:00
    - cron: "0 3 * * *"
  workflow_dispatch:      # 也可以在 Actions 页面手动点一下
  push:
    branches: [main]
    paths:
      - "feeds.txt"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取 + 实测 + 生成 db.json
        env:
          # 私有源放仓库 Secret（Settings → Secrets and variables → Actions）
          # 变量名 FEEDS_EXTRA，值可以是多个地址，逗号或换行分隔。不填也能跑。
          FEEDS_EXTRA: ${{ secrets.FEEDS_EXTRA }}
          # 1 = 自动搜索 GitHub 上活跃的 TVBox 合集仓（用内置 token，不消耗你的额度）
          DISCOVER: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync.py

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db.json lunatv.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: sync $(date -u +'%Y-%m-%d %H:%M UTC') ($(python -c "import json;print(len(json.load(open('db.json'))['sites']))") sites)"
            git push
          fi
