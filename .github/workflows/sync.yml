name: sync-db

on:
  schedule:
    # 每天 03:00 UTC = 北京时间 11:00
    - cron: "0 3 * * *"
  workflow_dispatch:      # 也可以在 Actions 页面手动点一下
  push:
    branches: [main]
    paths:
      - "feeds.txt"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取 + 实测 + 生成 db.json
        run: python sync.py

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: sync $(date -u +'%Y-%m-%d %H:%M UTC') ($(python -c "import json;print(len(json.load(open('db.json'))['sites']))") sites)"
            git push
          fi
