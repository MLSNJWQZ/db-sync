name: Guard - 巡检定时任务存活（互锁）

# 职责：盯住全仓库巡检器 repo-guard 自己别被静默停用，外加两条核心业务链双保险。
# 全量巡检由 repo-guard 仓库的「Repo Guard - 全仓库巡检」负责（每 6 小时）。
#
# 互锁关系：
#   repo-guard  →  巡检所有仓库（包括本仓库的 Guard）
#   本 workflow →  巡检 repo-guard 是否还活着
# 任一方被 GitHub 静默停用，另一方都能发现。

on:
  schedule:
    # 每天 UTC 00:37（北京 08:37）
    - cron: '37 0 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: 检查定时任务是否停摆
        env:
          # 必须用 PAT：GITHUB_TOKEN 只能读本仓库，看不到 repo-guard
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          : > guard_report.txt

          # 先确认 token 能用，否则所有检查都会误报成「没有记录」
          if ! gh api repos/MLSNJWQZ/db-sync --jq .name >/dev/null 2>&1; then
            echo "- ⚠️ 无法访问 GitHub API，GH_PAT 可能已过期或被撤销" >> guard_report.txt
            cat guard_report.txt
            exit 0
          fi

          check() {
            repo="$1"; wf="$2"; max_hours="$3"
            # 只认 schedule 触发：手动跑过不能代表定时任务健康
            last=$(gh api "repos/MLSNJWQZ/$repo/actions/runs?per_page=40" \
              --jq "[.workflow_runs[] | select(.name==\"$wf\" and .event==\"schedule\")][0].created_at" 2>/dev/null || echo "")

            if [ -z "$last" ] || [ "$last" = "null" ]; then
              # 没有任何定时触发记录，分三种情况处理
              wf_created=$(gh api "repos/MLSNJWQZ/$repo/actions/workflows?per_page=100" \
                --jq "[.workflows[] | select(.name==\"$wf\")][0].created_at // empty" 2>/dev/null || echo "")
              any_last=$(gh api "repos/MLSNJWQZ/$repo/actions/runs?per_page=20" \
                --jq "[.workflow_runs[] | select(.name==\"$wf\")][0].created_at // empty" 2>/dev/null || echo "")

              if [ -n "$wf_created" ]; then
                created_ts=$(date -d "$wf_created" +%s)
                age_days=$(( ($(date +%s) - created_ts) / 86400 ))
                if [ "$age_days" -lt 2 ]; then
                  echo "· $repo / $wf：$age_days 天前新建，还没轮到定时触发（宽限期跳过）"
                  return
                fi
              fi

              if [ -n "$any_last" ]; then
                echo "- $repo：工作流「$wf」有运行记录但全都不是定时触发（只有手动/推送）→ 定时任务已失效" >> guard_report.txt
              else
                echo "- $repo：工作流「$wf」找不到任何运行记录（配置了定时器却从未跑过）" >> guard_report.txt
              fi
              return
            fi

            last_ts=$(date -d "$last" +%s)
            age=$(( ($(date +%s) - last_ts) / 3600 ))
            if [ "$age" -gt "$max_hours" ]; then
              echo "- $repo：工作流「$wf」已 $age 小时没有定时触发（阈值 ${max_hours}h），疑似被 GitHub 停用" >> guard_report.txt
            fi
          }

          # 主巡检器（每 6 小时跑一次，容忍 12h）
          check repo-guard "Repo Guard - 全仓库巡检" 12
          # 双保险：两条核心业务链
          check lxmusic "Auto Sync & Keep Alive" 30
          check dongguaTV "Sync db.json (from db-sync)" 30

          echo "--- 巡检结果 ---"
          if [ -s guard_report.txt ]; then cat guard_report.txt; else echo "全部正常"; fi

      - name: 异常时开 Issue 通知 / 恢复时关闭
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="巡检告警：有仓库 Actions 停摆"
          open_n=$(gh issue list -R MLSNJWQZ/db-sync --search "巡检告警 in:title state:open" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -s guard_report.txt ]; then
            {
              echo "自动巡检发现以下问题："
              cat guard_report.txt
              echo ""
              echo "**处理方法**"
              echo "- 定时任务停摆：到对应仓库 Actions 页面确认状态。GitHub 会静默停用 fork 仓库的 schedule，此时面板仍显示 active。"
              echo "- 修复后本 Issue 会在下次巡检时自动关闭。"
            } > issue_body.md
            if [ -n "$open_n" ]; then
              gh issue comment "$open_n" -R MLSNJWQZ/db-sync --body-file issue_body.md
            else
              gh issue create -R MLSNJWQZ/db-sync --title "$TITLE" --body-file issue_body.md
            fi
          else
            if [ -n "$open_n" ]; then
              gh issue close "$open_n" -R MLSNJWQZ/db-sync -c "巡检恢复正常，自动关闭。"
            fi
            echo "无异常，无需处理"
          fi
